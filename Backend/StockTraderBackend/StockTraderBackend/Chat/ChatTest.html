<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        #chat-box {
            border: 1px solid #ccc;
            height: 400px;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .message {
            margin: 8px 0;
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 80%;
        }

        .user {
            background: #0084ff;
            color: white;
            margin-left: auto;
            text-align: right;
        }

        .assistant {
            background: #f0f0f0;
            color: black;
        }

        #input-area {
            display: flex;
            gap: 8px;
        }

        #message-input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            padding: 8px 16px;
            background: #0084ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

            button:disabled {
                background: #ccc;
                cursor: not-allowed;
            }

        #status {
            color: gray;
            font-size: 12px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <h2>KittyCatQuant Chat</h2>
    <div id="status">Connecting...</div>
    <div id="chat-box"></div>
    <div id="input-area">
        <input id="message-input" type="text" placeholder="Type a message..." disabled />
        <button id="send-btn" disabled>Send</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script>
const USER_ID = "f465ea9a-5fec-443d-affe-76e2c2799ad8";
let chatId = null;

const chatBox = document.getElementById("chat-box");
const input = document.getElementById("message-input");
const sendBtn = document.getElementById("send-btn");
const status = document.getElementById("status");

const connection = new signalR.HubConnectionBuilder()
// .withUrl("http://coms-4020-031.class.las.iastate.edu:8080/chat", {
// transport: signalR.HttpTransportType.LongPolling
// })
.withUrl("http://localhost:8080/chat", {
transport: signalR.HttpTransportType.LongPolling
})
.build();

function appendMessage(role, message) {
const div = document.createElement("div");
div.classList.add("message", role);
div.textContent = message;
chatBox.appendChild(div);
chatBox.scrollTop = chatBox.scrollHeight;
}

connection.on("ChatCreated", (id, sessionName) => {
chatId = id;
status.textContent = `Connected, Session: ${sessionName}`;
input.disabled = false;
sendBtn.disabled = false;
});

connection.on("ReceiveMessage", (message, role, timestamp) => {
appendMessage(role, message);
input.disabled = false;
sendBtn.disabled = false;
});

connection.on("Error", (error) => {
status.textContent = `Error: ${error}`;
});

connection.start().then(() => {
connection.invoke("CreateChat", USER_ID, "Test Session");
});

function sendMessage() {
const message = input.value.trim();
if (!message || !chatId) return;

appendMessage("user", message);
input.value = "";
input.disabled = true;
sendBtn.disabled = true;

connection.invoke("SendMessage", USER_ID, chatId, message);
}

sendBtn.addEventListener("click", sendMessage);

input.addEventListener("keypress", (e) => {
if (e.key === "Enter") sendMessage();
});
    </script>
</body>
</html>
